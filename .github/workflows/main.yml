name: Build Typst & Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      - name: Compila e prepara la cartella pubblica
        run: |
          # 1. Creiamo la cartella finale per il web
          mkdir -p public/pdf/archivio

          # 2. Copiamo la vetrina web e gli asset
          cp index.html public/
          cp -r assets public/ || true

          # 3. Compiliamo tutti i file Typst nella root
          for file in *.typ; do
            if [ -f "$file" ]; then
              echo "Compilazione di $file..."
              typst compile "$file" "public/pdf/${file%.typ}.pdf"
            fi
          done

          # 4. Compiliamo i file Typst nell'archivio
          for file in archivio/*.typ; do
            if [ -f "$file" ]; then
              echo "Compilazione di $file..."
              typst compile "$file" "public/pdf/${file%.typ}.pdf"
            fi
          done

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
