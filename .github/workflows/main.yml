name: Build Typst & Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"] # Si attiva anche quando qualcuno apre una PR per richiedere verifica

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      - name: Compila i documenti
        run: |
          mkdir -p output_pdf/archivio
          # (Qui va il ciclo for che abbiamo visto prima per compilare i .typ)

      # Questo step carica i PDF generati nella PR come file scaricabili
      - name: Upload PDF Preview (solo per le Pull Request)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Anteprima-PDF-Verificatore
          path: output_pdf/
          retention-days: 5 # I file temporanei si cancellano da soli dopo 5 giorni
          
      # Gli step di deploy su GitHub Pages vanno eseguiti SOLO sul main
      # (Si aggiunge "if: github.ref == 'refs/heads/main'")
