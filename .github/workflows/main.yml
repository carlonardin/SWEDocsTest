name: Build Typst & Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      - name: Compila e prepara la cartella pubblica
        run: |
          # 1. Copiamo la vetrina web e gli asset (ignorando gli errori se assets non esiste ancora)
          mkdir -p public
          cp index.html public/
          cp -r assets public/ || true

          # 2. Compiliamo tutti i file Typst mantenendo la struttura originale delle cartelle
          # Questo script trova tutti i file .typ e crea le cartelle corrispondenti in public/pdf/
          find . -name "*.typ" -type f | while read -r file; do
            # Pulisce il percorso rimuovendo il './' iniziale
            clean_file=$(echo "$file" | sed 's|^\./||')
            dir_path=$(dirname "$clean_file")
            
            # Crea la cartella di destinazione speculare
            mkdir -p "public/pdf/$dir_path"
            
            # Compila il file
            echo "Compilazione di $clean_file..."
            typst compile "$clean_file" "public/pdf/${clean_file%.typ}.pdf"
          done

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
